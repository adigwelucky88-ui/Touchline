# Local Postgres (host port 5433 to avoid clashing with a local install) matching the Aurora PostgreSQL major version used in AWS.
name: touchline
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: touchline
      POSTGRES_PASSWORD: touchline
      POSTGRES_DB: touchline
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
